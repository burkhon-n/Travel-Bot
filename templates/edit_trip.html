<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light">
  <title>Edit {{ trip.name }}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  {% include 'shared_styles.html' %}
  <style>
    .form-container { padding: var(--spacing-md); padding-bottom: 100px; }
    
    .form-section {
      background: var(--glass-white-strong);
      backdrop-filter: blur(40px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border-strong);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
    }
    
    .form-section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .input-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-sm);
    }
    
    .form-textarea {
      width: 100%;
      min-height: 100px;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: var(--glass-white);
      font-size: 16px;
      font-family: inherit;
      color: var(--text-primary);
      resize: vertical;
      outline: none;
    }
    
    .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    
    .form-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }
    
    .status-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .status-option {
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2px solid var(--glass-border);
      background: var(--glass-white);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .status-option input { display: none; }
    
    .status-option:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    
    .status-option-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .status-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    
    .fixed-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--spacing-md);
      background: var(--glass-white-strong);
      backdrop-filter: blur(40px);
      border-top: 1px solid var(--glass-border);
      z-index: 50;
      display: flex;
      gap: var(--spacing-sm);
    }
    
    .danger-zone {
      background: rgba(255, 59, 48, 0.08);
      border: 1px solid rgba(255, 59, 48, 0.2);
    }
    
    .danger-zone .form-section-title { color: var(--danger); }
  </style>
</head>
<body>
  <div class="glass-header-gradient">
    <a href="/admin/trip/{{ trip.id }}" style="color: rgba(255,255,255,0.9); text-decoration: none; font-size: 14px;">← Back</a>
    <h1 class="header-title">Edit Trip</h1>
    <p class="header-subtitle">{{ trip.name }}</p>
  </div>

  <form id="editForm">
    <input type="hidden" name="trip_id" value="{{ trip.id }}">
    
    <div class="form-container">
      <div class="form-section">
        <div class="form-section-title">✈️ Trip Details</div>
        
        <div class="form-group">
          <label class="form-label">Trip Name</label>
          <input type="text" class="form-input" name="name" value="{{ trip.name }}" required>
        </div>
        
        <div class="input-row">
          <div class="form-group">
            <label class="form-label">Price (UZS)</label>
            <input type="number" class="form-input" name="price" value="{{ trip.price }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Participant Limit</label>
            <input type="number" class="form-input" name="participant_limit" value="{{ trip.participant_limit or '' }}">
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-section-title">📊 Status</div>
        
        <div class="status-selector">
          <label class="status-option">
            <input type="radio" name="status" value="active" {{ 'checked' if trip.status == 'active' }}>
            <div class="status-icon">✓</div>
            <div class="status-option-label">Active</div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="closed" {{ 'checked' if trip.status == 'closed' }}>
            <div class="status-icon">🔒</div>
            <div class="status-option-label">Closed</div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="cancelled" {{ 'checked' if trip.status == 'cancelled' }}>
            <div class="status-icon">✕</div>
            <div class="status-option-label">Cancelled</div>
          </label>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-section-title">💳 Payment Info</div>
        <div class="form-group">
          <label class="form-label">Payment Instructions</label>
          <textarea class="form-textarea" name="payment_info">{{ trip.payment_info or '' }}</textarea>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-section-title">📋 Agreement</div>
        <div class="form-group">
          <label class="form-label">Terms & Conditions</label>
          <textarea class="form-textarea" name="agreement">{{ trip.agreement or '' }}</textarea>
        </div>
      </div>
      
      <div class="form-section danger-zone">
        <div class="form-section-title">⚠️ Danger Zone</div>
        <button type="button" class="btn-glass btn-danger btn-block" id="deleteBtn">
          🗑️ Delete Trip
        </button>
        <p class="form-hint" style="text-align: center; margin-top: 8px;">This action cannot be undone</p>
      </div>
    </div>
    
    <div class="fixed-footer">
      <button type="button" class="btn-glass btn-secondary" style="flex: 1;" onclick="history.back()">Cancel</button>
      <button type="submit" class="btn-glass btn-primary" style="flex: 2;" id="submitBtn">💾 Save Changes</button>
    </div>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();
    tg?.setHeaderColor('#007AFF');
    
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Saving...';
      
      try {
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        
        const r = await fetch(`/admin/api/trip/{{ trip.id }}/update`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Telegram-Id': (tg?.initDataUnsafe?.user?.id || 0)
          },
          body: JSON.stringify(data)
        });
        
        if (!r.ok) throw new Error('Failed to save');
        
        tg?.HapticFeedback?.notificationOccurred('success');
        tg?.showAlert('✓ Changes saved!');
        setTimeout(() => window.location.href = '/admin', 500);
        
      } catch(err) {
        tg?.HapticFeedback?.notificationOccurred('error');
        tg?.showAlert('✗ ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '💾 Save Changes';
      }
    });
    
    document.getElementById('deleteBtn').addEventListener('click', () => {
      tg?.showConfirm('Are you sure you want to delete this trip? This cannot be undone.', async (ok) => {
        if (!ok) return;
        
        try {
          const r = await fetch(`/admin/api/trip/{{ trip.id }}/delete`, {
            method: 'POST',
            headers: { 'X-Telegram-Id': (tg?.initDataUnsafe?.user?.id || 0) }
          });
          
          if (!r.ok) throw new Error('Failed');
          
          tg?.HapticFeedback?.notificationOccurred('success');
          tg?.showAlert('Trip deleted');
          window.location.href = '/admin';
        } catch(e) {
          tg?.HapticFeedback?.notificationOccurred('error');
          tg?.showAlert('Failed to delete');
        }
      });
    });
  </script>
</body>
</html>
